<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!--@head: title, description, canonical, hreflang, Open Graph (server/render.js)-->
  <meta name="robots" content="index, follow">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6Q874P6V67"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-6Q874P6V67');</script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    :root {
      --ink: #1a2e35;
      --ink-2: #2d4a54;
      --ink-3: #5a7d87;
      --ink-4: #8ca5ad;
      --teal: #0d9488;
      --teal-deep: #0a7c72;
      --warm: #fafafa;
      --white: #ffffff;
      --rule: rgba(13, 148, 136, 0.12);
      --cargo: #2563eb;
      --tanker: #dc2626;
      --passenger: #16a34a;
      --fishing: #ca8a04;
      --other: #8ca5ad;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--warm);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .spot-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--rule);
      background: var(--white);
    }
    .spot-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--teal);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .spot-back:hover { text-decoration: underline; }
    .spot-topbar-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }
    .spot-reset-btn {
      display: none;
      align-items: center;
      gap: 4px;
      background: none;
      border: 1px solid var(--rule);
      color: var(--ink-3);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      padding: 5px 10px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .spot-reset-btn.visible { display: inline-flex; }
    .spot-reset-btn:hover { color: var(--teal); border-color: var(--teal); }

    /* ── Live map ── */
    .spot-map-wrap {
      position: relative;
      height: 45vh;
      min-height: 260px;
      flex-shrink: 0;
    }
    #spot-map { width: 100%; height: 100%; }
    .spot-map-heading {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(26,46,53,0.85);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 5px 16px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      display: none;
    }
    .spot-map-heading.visible { display: block; }

    /* North indicator — shows where north is while the map rotates heading-up */
    .spot-north {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(26,46,53,0.85);
      display: none; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .spot-north.visible { display: flex; }
    #spot-north-needle { transform-origin: 50% 50%; display: block; }

    /* Manual zoom buttons (auto-zoom pauses briefly when used) */
    .spot-zoom {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      z-index: 10; display: none; flex-direction: column;
    }
    .spot-zoom.visible { display: flex; }
    .spot-zoom button {
      width: 38px; height: 38px;
      background: rgba(255,255,255,0.92); color: var(--ink, #1a2e35);
      border: 1px solid rgba(26,46,53,0.15); cursor: pointer;
      font-size: 20px; font-weight: 600; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .spot-zoom button + button { border-top: none; }
    .spot-zoom button:active { background: rgba(13,148,136,0.1); }

    /* ── Bottom panel ── */
    .spot-panel {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }

    /* Calibration tip */
    .calibration-tip {
      display: none;
      text-align: center;
      padding: 16px;
      background: var(--white);
      border: 1px solid var(--rule);
    }
    .calibration-tip.visible { display: block; }
    .calibration-tip-icon { font-size: 36px; margin-bottom: 8px; }
    .calibration-tip-text {
      font-size: 13px;
      color: var(--ink-3);
      line-height: 1.5;
    }
    .calibration-tip-text strong { color: var(--ink); }
    .calibration-dismiss {
      display: inline-block;
      margin-top: 10px;
      background: none;
      border: none;
      color: var(--teal);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    /* Start button */
    .spot-start {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--teal);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .spot-start:hover { opacity: 0.85; }
    .spot-start:disabled { opacity: 0.5; cursor: not-allowed; }
    .spot-start.stop-btn {
      background: none;
      color: var(--ink-3);
      border: 1px solid var(--rule);
      font-size: 14px;
      padding: 10px;
    }

    .spot-status {
      text-align: center;
      font-size: 13px;
      color: var(--ink-3);
    }
    .spot-status.error { color: #dc2626; }
    .spot-status.warn { color: #b45309; }

    /* Debug overlay (?debug=1) */
    .spot-debug {
      display: none;
      position: fixed; top: 8px; left: 8px; right: 8px; z-index: 999;
      background: rgba(15, 26, 30, 0.88); color: #a7f3d0;
      font: 10px/1.5 ui-monospace, Menlo, Consolas, monospace;
      padding: 8px 10px; white-space: pre-wrap; pointer-events: none;
      border: 1px solid rgba(167, 243, 208, 0.3);
    }
    .spot-debug.visible { display: block; }

    /* Scanner */
    .spot-scanner {
      text-align: center;
      padding: 8px 0;
      display: none;
    }
    .spot-scanner.active { display: block; }
    .scanner-label {
      font-size: 12px;
      color: var(--ink-4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    /* Result card */
    .spot-result {
      background: var(--white);
      border: 1px solid var(--rule);
      overflow: hidden;
      display: none;
      animation: slideUp 0.3s ease-out;
    }
    .spot-result.visible { display: block; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
    }
    .result-flag { width: 36px; height: 27px; object-fit: cover; flex-shrink: 0; }
    .result-info { flex: 1; min-width: 0; }
    .result-name { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
    .result-type {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 1px 8px; color: white; margin-top: 4px; text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .result-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-top: 1px solid var(--rule);
    }
    .result-stat { text-align: center; padding: 10px 6px; }
    .result-stat + .result-stat { border-left: 1px solid var(--rule); }
    .result-stat-value { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .result-stat-label { font-size: 10px; color: var(--ink-4); margin-top: 2px; }

    .result-details { border-top: 1px solid var(--rule); padding: 6px 16px; }
    .result-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
    .result-row + .result-row { border-top: 1px solid var(--rule); }
    .result-row-label { color: var(--ink-3); }
    .result-row-value { font-weight: 500; }

    /* No match */
    .no-match { text-align: center; padding: 24px 16px; display: none; }
    .no-match.visible { display: block; }
    .no-match-icon { font-size: 36px; margin-bottom: 6px; }
    .no-match p { color: var(--ink-3); font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="spot-topbar">
    <a class="spot-back" href="/">&larr; <span id="t-back" data-i18n="sp_back">Back</span></a>
    <span class="spot-topbar-title" id="t-title" data-i18n="sp_title">What's That Boat?</span>
    <button class="spot-reset-btn" id="spot-reset">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      <span id="t-reset" data-i18n="sp_reset">Reset</span>
    </button>
  </div>

  <!-- Live map -->
  <div class="spot-map-wrap">
    <div id="spot-map"></div>
    <div class="spot-map-heading" id="spot-heading-display"></div>
    <div class="spot-north" id="spot-north">
      <svg id="spot-north-needle" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2 L16 12 L12 10 L8 12 Z" fill="#ef4444"/>
        <text x="12" y="21" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">N</text>
      </svg>
    </div>
    <div class="spot-zoom" id="spot-zoom">
      <button type="button" id="spot-zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="spot-zoom-out" aria-label="Zoom out">&minus;</button>
    </div>
  </div>

  <!-- Debug overlay (visible with ?debug=1) -->
  <div class="spot-debug" id="spot-debug"></div>

  <!-- Bottom panel -->
  <div class="spot-panel">

    <!-- Calibration tip (shown before first start) -->
    <div class="calibration-tip visible" id="calibration-tip">
      <div class="calibration-tip-icon">&#128260;</div>
      <p class="calibration-tip-text" id="t-calibration" data-i18n-html="sp_calibration">
        <strong>Tip:</strong> Before starting, wave your phone slowly in a figure-8 pattern to calibrate the compass. This greatly improves accuracy.
      </p>
      <button class="calibration-dismiss" id="calibration-dismiss"><span id="t-got-it" data-i18n="sp_got_it">Got it</span></button>
    </div>

    <button class="spot-start" id="spot-start">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="t-start" data-i18n="sp_start">Start Spotting</span>
    </button>

    <p class="spot-status" id="spot-status"></p>

    <div class="spot-scanner" id="spot-scanner">
      <div class="scanner-label" id="t-scanning" data-i18n="sp_scanning">Scanning...</div>
    </div>

    <div class="spot-result" id="spot-result">
      <div class="result-top">
        <img class="result-flag" id="result-flag" src="" alt="" />
        <div class="result-info">
          <div class="result-name" id="result-name"></div>
          <span class="result-type" id="result-type"></span>
        </div>
      </div>
      <div class="result-stats">
        <div class="result-stat">
          <div class="result-stat-value" id="result-distance"></div>
          <div class="result-stat-label" id="t-distance" data-i18n="sp_distance">Distance</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-value" id="result-speed"></div>
          <div class="result-stat-label" id="t-speed" data-i18n="sp_speed">Speed</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-value" id="result-bearing"></div>
          <div class="result-stat-label" id="t-bearing" data-i18n="sp_bearing">Bearing</div>
        </div>
      </div>
      <div class="result-details">
        <div class="result-row">
          <span class="result-row-label" id="t-dest-label" data-i18n="sp_destination">Destination</span>
          <span class="result-row-value" id="result-destination"></span>
        </div>
        <div class="result-row">
          <span class="result-row-label" id="t-dim-label" data-i18n="sp_dimensions">Dimensions</span>
          <span class="result-row-value" id="result-dimensions"></span>
        </div>
        <div class="result-row">
          <span class="result-row-label" id="t-status-label" data-i18n="sp_status">Status</span>
          <span class="result-row-value" id="result-status"></span>
        </div>
      </div>
    </div>

    <div class="no-match" id="no-match">
      <div class="no-match-icon">&#127754;</div>
      <p id="t-no-match" data-i18n-html="sp_no_match">No vessel found in that direction.<br>Try pointing at a different angle.</p>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <!--@spot-i18n-->
  <script>
    // ── i18n ──
    // Strings come from the shared dictionary (public/js/i18n-data.js). The server
    // renders the visible text and injects this page's subset as window.SPOT_I18N.
    const SPOT_I18N = window.SPOT_I18N || { s: {}, statuses: {}, types: {} };
    const S = SPOT_I18N.s;
    const statusMap = SPOT_I18N.statuses;
    const typeMap = SPOT_I18N.types;

    const TYPE_COLORS = {
      Cargo: '#2563eb', Tanker: '#dc2626', Passenger: '#16a34a',
      Fishing: '#ca8a04', Other: '#8ca5ad',
    };

    function translateStatus(label) {
      if (!label) return '--';
      if (statusMap[label]) return statusMap[label];
      for (const [key, val] of Object.entries(statusMap)) {
        if (key.toLowerCase() === label.toLowerCase()) return val;
      }
      return label;
    }
    function translateType(label) { return typeMap[label] || label || '--'; }

    // ── State ──
    let userLat = null, userLng = null;
    let gpsAccuracy = null;          // meters, from the GPS fix
    let compassHeading = null;
    let smoothedHeading = null;
    let rawHeading = null;           // last unsmoothed heading (debug)
    let headingSource = null;        // 'ios' | 'absolute' | 'relative'
    let gotAbsolute = false;         // an absolute source is feeding us
    let iosAccuracy = null;          // webkitCompassAccuracy (deg, <0 = uncalibrated)
    let warnTimer = null;
    let orientationSensor = null;    // AbsoluteOrientationSensor (Chrome Android)
    let sensorActive = false;        // sensor delivered a reading; ignore event streams
    let tiltMag = null;              // horizontal magnitude of camera vector (debug)
    let autoViewKm = null;           // how far ahead the view should reach (match dist)
    let manualZoomUntil = 0;         // pause auto-zoom while the user zooms manually
    let vessels = [];
    let active = false;
    let matchInterval = null;
    let geoWatchId = null;
    let lastMatchMmsi = null;
    const SMOOTHING = 0.15;
    const CONE_HALF = 25;  // ±25° matching cone (was ±15°)
    const MAX_DIST = 50;   // km
    // Magnetic declination at Quy Nhon (~2026): about -0.6° (true = magnetic - 0.6).
    // Tiny vs the ±25° cone, but free to apply since all sources are magnetic-north.
    const DECLINATION = -0.6;
    // Score: alignment matters most; distance is a soft tiebreaker (1 km ≈ 1.5°).
    const DIST_WEIGHT = 1.5;
    // Default view depth while scanning (no match yet): wide enough that ships
    // far out in the bay are on screen, so you can see what you're sweeping past.
    const DEFAULT_VIEW_KM = 10;
    const DEBUG = new URLSearchParams(location.search).has('debug');
    const debugState = { candidates: [] };

    const $ = (id) => document.getElementById(id);


    // Dismiss calibration tip
    $('calibration-dismiss').addEventListener('click', () => {
      $('calibration-tip').classList.remove('visible');
    });

    // ── Map setup ──
    const map = new maplibregl.Map({
      container: 'spot-map',
      style: `https://api.maptiler.com/maps/streets/style.json?key=CKY69E5ib1MMQDfWMRvg`,
      center: [109.23, 13.76],
      zoom: 13,
      attributionControl: false,
    });

    map.on('load', () => {
      // User position source
      map.addSource('user-pos', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
      });
      // Pointing cone source
      map.addSource('cone', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
      });
      // Vessel markers source
      map.addSource('spot-vessels', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
      });
      // Matched vessel highlight
      map.addSource('spot-match', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
      });

      // Cone layer (semi-transparent wedge)
      map.addLayer({
        id: 'cone-fill',
        type: 'fill',
        source: 'cone',
        paint: {
          'fill-color': '#0d9488',
          'fill-opacity': 0.12,
        },
      });
      map.addLayer({
        id: 'cone-outline',
        type: 'line',
        source: 'cone',
        paint: {
          'line-color': '#0d9488',
          'line-width': 1.5,
          'line-opacity': 0.4,
        },
      });

      // Vessel dots
      map.addLayer({
        id: 'spot-vessel-dots',
        type: 'circle',
        source: 'spot-vessels',
        paint: {
          'circle-radius': 5,
          'circle-color': ['get', 'color'],
          'circle-stroke-width': 1.5,
          'circle-stroke-color': '#fff',
        },
      });

      // Matched vessel ring
      map.addLayer({
        id: 'spot-match-ring',
        type: 'circle',
        source: 'spot-match',
        paint: {
          'circle-radius': 12,
          'circle-color': 'transparent',
          'circle-stroke-width': 3,
          'circle-stroke-color': '#f97316',
        },
      });

      // User dot (on top)
      map.addLayer({
        id: 'user-dot',
        type: 'circle',
        source: 'user-pos',
        paint: {
          'circle-radius': 7,
          'circle-color': '#0071e3',
          'circle-stroke-width': 2.5,
          'circle-stroke-color': '#fff',
        },
      });
    });

    // ── Generate cone polygon ──
    function makeConeGeoJSON(lng, lat, heading, halfAngle, radiusKm) {
      const steps = 20;
      const coords = [[lng, lat]];
      const startAngle = heading - halfAngle;
      const endAngle = heading + halfAngle;
      for (let i = 0; i <= steps; i++) {
        const angle = startAngle + (endAngle - startAngle) * (i / steps);
        const rad = (angle * Math.PI) / 180;
        const dLat = (radiusKm / 111.32) * Math.cos(rad);
        const dLng = (radiusKm / (111.32 * Math.cos((lat * Math.PI) / 180))) * Math.sin(rad);
        coords.push([lng + dLng, lat + dLat]);
      }
      coords.push([lng, lat]); // close polygon
      return {
        type: 'Feature',
        geometry: { type: 'Polygon', coordinates: [coords] },
      };
    }

    // ── Update map layers ──
    function updateMap() {
      if (!map.isStyleLoaded()) return;

      // User position
      if (userLat != null) {
        map.getSource('user-pos')?.setData({
          type: 'FeatureCollection',
          features: [{ type: 'Feature', geometry: { type: 'Point', coordinates: [userLng, userLat] } }],
        });
      }

      // Cone — reaches the matched boat (capped), not a fixed 3km
      const coneKm = Math.max(2, Math.min(autoViewKm != null ? autoViewKm * 1.05 : DEFAULT_VIEW_KM, 15));
      if (userLat != null && smoothedHeading != null && active) {
        const cone = makeConeGeoJSON(userLng, userLat, smoothedHeading, CONE_HALF, coneKm);
        map.getSource('cone')?.setData({ type: 'FeatureCollection', features: [cone] });
      } else {
        map.getSource('cone')?.setData({ type: 'FeatureCollection', features: [] });
      }

      // Heading-up: rotate the map with the phone so "forward" is always up
      // (the cone then points straight ahead), camera locked on the user.
      if (active && userLat != null && smoothedHeading != null) {
        const opts = { center: [userLng, userLat], bearing: smoothedHeading };
        // Auto-zoom: keep the matched boat in view (no match -> ~3km view).
        // Eased a little per tick so it glides instead of pumping; paused for
        // a while whenever the user zooms manually.
        if (autoViewKm != null && Date.now() > manualZoomUntil) {
          const target = zoomForDistanceKm(autoViewKm);
          const z = map.getZoom();
          if (Math.abs(target - z) > 0.02) opts.zoom = z + (target - z) * 0.08;
        }
        map.jumpTo(opts);
        const needle = document.getElementById('spot-north-needle');
        if (needle) needle.style.transform = 'rotate(' + (-smoothedHeading) + 'deg)';
      }

      // Vessel markers
      const vesselFeatures = vessels
        .filter(v => v.lat != null && v.lng != null)
        .map(v => ({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [v.lng, v.lat] },
          properties: {
            color: TYPE_COLORS[v.vessel_type_label] || TYPE_COLORS.Other,
            name: v.name || v.mmsi,
          },
        }));
      map.getSource('spot-vessels')?.setData({ type: 'FeatureCollection', features: vesselFeatures });
    }

    function highlightMatch(vessel) {
      if (!map.isStyleLoaded()) return;
      if (vessel) {
        map.getSource('spot-match')?.setData({
          type: 'FeatureCollection',
          features: [{ type: 'Feature', geometry: { type: 'Point', coordinates: [vessel.lng, vessel.lat] } }],
        });
      } else {
        map.getSource('spot-match')?.setData({ type: 'FeatureCollection', features: [] });
      }
    }

    // ── Geo math ──
    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function bearingTo(lat1, lon1, lat2, lon2) {
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1*Math.PI/180) * Math.sin(lat2*Math.PI/180) -
                Math.sin(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.cos(dLon);
      return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
    }

    function angleDiff(a, b) {
      let d = ((b - a + 180) % 360) - 180;
      return Math.abs(d < -180 ? d + 360 : d);
    }

    function lerpAngle(from, to, t) {
      let diff = ((to - from + 540) % 360) - 180;
      return ((from + diff * t) + 360) % 360;
    }

    // Zoom level at which `km` ahead of the user fits on screen. The user dot
    // sits at ~67.5% of the map height (35% top padding), so the view ahead is
    // the remaining pixels to the top edge, with a small margin.
    function zoomForDistanceKm(km) {
      const h = map.getContainer().clientHeight || 300;
      const pixelsAhead = h * 0.675 * 0.85;
      const metersPerPixel = (km * 1000) / pixelsAhead;
      const z = Math.log2(156543.03392 * Math.cos(userLat * Math.PI / 180) / metersPerPixel);
      return Math.max(10, Math.min(15.5, z));
    }

    // ── Vessel loading ──
    async function loadVessels() {
      try {
        const res = await fetch('/api/vessels');
        // Leave out fishing gear: net markers sit at water level and can't be
        // seen from shore, so pointing at a ship should never match one.
        vessels = (await res.json()).filter(v => !v.is_gear);
        // Strip trailing battery indicator from fishing-boat names ("TY 15 D37 15%")
        for (const v of vessels) {
          if (v.name) v.name = String(v.name).replace(/[\s-]*\d{1,3}%\s*$/, '').trim() || v.name;
        }
        updateMap();
      } catch (e) { console.error('Failed to load vessels:', e); }
    }

    // ── Matching ──
    // Pick the vessel you're most likely LOOKING AT: best angular alignment
    // first, with distance as a soft tiebreaker (DIST_WEIGHT km ≈ 1° of
    // misalignment). The old nearest-in-cone rule let a close boat at the cone
    // edge beat the far ship dead ahead.
    function findMatchingVessel() {
      if (userLat == null || compassHeading == null || vessels.length === 0) return null;
      let best = null, bestScore = Infinity;
      const candidates = [];
      for (const v of vessels) {
        if (v.lat == null || v.lng == null) continue;
        const dist = haversine(userLat, userLng, v.lat, v.lng);
        if (dist > MAX_DIST) continue;
        const bearing = bearingTo(userLat, userLng, v.lat, v.lng);
        const diff = angleDiff(compassHeading, bearing);
        const score = diff + dist * DIST_WEIGHT;
        if (DEBUG) candidates.push({ name: v.name || v.mmsi, dist, bearing, diff, score, matched: false });
        if (diff <= CONE_HALF && score < bestScore) {
          best = { ...v, dist, bearing };
          bestScore = score;
        }
      }
      if (DEBUG) {
        candidates.sort((a, b) => a.score - b.score);
        if (best) {
          const m = candidates.find((c) => c.name === (best.name || best.mmsi));
          if (m) m.matched = true;
        }
        debugState.candidates = candidates;
        updateDebug();
      }
      return best;
    }

    // ── Display result ──
    function showResult(vessel) {
      $('no-match').classList.remove('visible');
      $('spot-result').classList.add('visible');

      // Only real 2-letter codes make a flag image; old rows stored names.
      const cc = /^[a-z]{2}$/i.test(vessel.flag_country || '') ? vessel.flag_country.toLowerCase() : '';
      $('result-flag').src = cc ? `https://flagcdn.com/40x30/${cc}.png` : '';
      $('result-flag').style.display = cc ? '' : 'none';
      $('result-name').textContent = vessel.name || vessel.mmsi;

      const type = vessel.vessel_type_label || 'Other';
      $('result-type').textContent = translateType(type);
      $('result-type').style.background = TYPE_COLORS[type] || TYPE_COLORS.Other;

      $('result-distance').textContent = vessel.dist < 1 ? (vessel.dist * 1000).toFixed(0) + ' m' : vessel.dist.toFixed(1) + ' km';
      $('result-speed').textContent = vessel.speed != null ? vessel.speed.toFixed(1) + ' kn' : '--';
      $('result-bearing').textContent = Math.round(vessel.bearing) + '\u00B0';

      $('result-destination').textContent = vessel.destination || '--';
      $('result-dimensions').textContent = vessel.length && vessel.width ? `${vessel.length} x ${vessel.width} m` : '--';
      $('result-status').textContent = translateStatus(vessel.nav_status_label);

      highlightMatch(vessel);

      // Haptic feedback on NEW match
      if (vessel.mmsi !== lastMatchMmsi) {
        lastMatchMmsi = vessel.mmsi;
        if (navigator.vibrate) navigator.vibrate(80);
      }
    }

    function showNoMatch() {
      $('spot-result').classList.remove('visible');
      $('no-match').classList.add('visible');
      highlightMatch(null);
      lastMatchMmsi = null;
    }

    // ── Compass handling ──
    //
    // Two problems the old code had:
    //  1. `deviceorientationabsolute` and `deviceorientation` were both wired to
    //     the same handler. On Android Chrome both streams fire interleaved; the
    //     relative one has an arbitrary zero point, so the smoothed heading
    //     settled between a real heading and a bogus one.
    //  2. `360 - alpha` is only the compass heading while the phone lies FLAT.
    //     Pointing at a boat you hold the phone upright like a camera, where raw
    //     alpha is off by tens of degrees.
    //
    // Fix: per-source handlers with strict priority (iOS webkitCompassHeading >
    // absolute orientation > relative fallback), and a tilt-compensated heading
    // computed from the full alpha/beta/gamma rotation.

    // Heading of where the CAMERA points. Camera-first: once the phone is
    // tilted more than ~20° off flat (always true when aiming at a boat), the
    // back-camera direction alone is the heading — it is literally where the
    // user points, and it's immune to wrist roll and landscape grip. Only when
    // the phone is near-flat (camera pointing at the ground, horizontal
    // projection degenerate) do we crossfade to the top-edge direction.
    // A naive sum of the two vectors (previous version) let the top edge drag
    // the heading sideways whenever the phone was rolled — up to ~45° off in
    // landscape, which read as "points left of the target".
    function combineHeading(backE, backN, topE, topN) {
      const backMag = Math.hypot(backE, backN);
      const topMag = Math.hypot(topE, topN);
      tiltMag = backMag;
      const w = Math.min(backMag / 0.35, 1); // ≥ ~20° tilt -> pure camera
      let e = 0, n = 0;
      if (backMag > 1e-6) { e += (backE / backMag) * w; n += (backN / backMag) * w; }
      if (topMag > 1e-6) { e += (topE / topMag) * (1 - w); n += (topN / topMag) * (1 - w); }
      if (Math.abs(e) < 1e-9 && Math.abs(n) < 1e-9) return null;
      return ((Math.atan2(e, n) * 180 / Math.PI) + 360) % 360;
    }

    // Earth frame: X=east, Y=north, Z=up. Device rotation R = Rz(a)*Rx(b)*Ry(g)
    // (W3C deviceorientation order). Project the back camera (-Z_device) and
    // top edge (+Y_device) onto the horizontal plane.
    function headingFromEuler(alpha, beta, gamma) {
      const d = Math.PI / 180;
      const a = alpha * d, b = beta * d, g = gamma * d;
      const ca = Math.cos(a), sa = Math.sin(a);
      const cb = Math.cos(b), sb = Math.sin(b);
      const cg = Math.cos(g), sg = Math.sin(g);
      const backE = -(ca * sg + sa * sb * cg);
      const backN = -(sa * sg - ca * sb * cg);
      const topE = -sa * cb;
      const topN = ca * cb;
      return combineHeading(backE, backN, topE, topN);
    }

    // Same projection from a unit quaternion [x,y,z,w] (device -> earth ENU).
    // Used with AbsoluteOrientationSensor, which avoids Euler-angle ambiguity
    // entirely (the gimbal weirdness near vertical that plagues alpha/beta/gamma).
    function headingFromQuaternion(q) {
      const [x, y, z, w] = q;
      // Rotation-matrix columns: device Z and Y axes expressed in earth frame
      const zx = 2 * (x * z + w * y), zy = 2 * (y * z - w * x);
      const yx = 2 * (x * y - w * z), yy = 1 - 2 * (x * x + z * z);
      return combineHeading(-zx, -zy, yx, yy);
    }

    // Chrome Android: prefer the fused quaternion sensor when available.
    function startSensor() {
      if (!('AbsoluteOrientationSensor' in window)) return false;
      try {
        const sensor = new AbsoluteOrientationSensor({ frequency: 20 });
        sensor.addEventListener('reading', () => {
          if (!sensor.quaternion) return;
          sensorActive = true;
          gotAbsolute = true;
          acceptHeading(headingFromQuaternion(sensor.quaternion), 'sensor');
        });
        sensor.addEventListener('error', () => {
          // Permission/availability problem — fall back to orientation events
          try { sensor.stop(); } catch (e) { /* already stopped */ }
          if (orientationSensor === sensor) { orientationSensor = null; sensorActive = false; }
        });
        sensor.start();
        orientationSensor = sensor;
        return true;
      } catch (e) {
        orientationSensor = null;
        return false;
      }
    }

    function acceptHeading(heading, source) {
      if (heading == null || !Number.isFinite(heading)) return;
      heading = ((heading + DECLINATION) + 360) % 360;
      rawHeading = heading;
      headingSource = source;
      smoothedHeading = smoothedHeading == null ? heading : lerpAngle(smoothedHeading, heading, SMOOTHING);
      compassHeading = smoothedHeading;
      $('spot-heading-display').textContent = Math.round(smoothedHeading) + '°';
      updateMap();
      if (DEBUG) updateDebug();
    }

    // Android Chrome: fused absolute orientation (magnetometer + gyro)
    function onOrientationAbsolute(e) {
      if (sensorActive) return; // quaternion sensor is feeding us
      if (e.alpha == null) return;
      gotAbsolute = true;
      acceptHeading(headingFromEuler(e.alpha, e.beta || 0, e.gamma || 0), 'absolute');
    }

    // iOS Safari (webkitCompassHeading) + Firefox Android (absolute flag) +
    // last-resort relative fallback for devices with neither.
    function onOrientationGeneric(e) {
      if (sensorActive) return; // quaternion sensor is feeding us
      if (e.webkitCompassHeading != null) {
        gotAbsolute = true;
        iosAccuracy = e.webkitCompassAccuracy != null ? e.webkitCompassAccuracy : null;
        // webkitCompassHeading is tilt-compensated by CoreMotion already.
        acceptHeading(e.webkitCompassHeading, 'ios');
        // Surface calibration trouble (negative = invalid, large = poor)
        if (iosAccuracy != null && (iosAccuracy < 0 || iosAccuracy > 30)) showCompassWarn();
        return;
      }
      if (e.absolute && e.alpha != null) {
        gotAbsolute = true;
        acceptHeading(headingFromEuler(e.alpha, e.beta || 0, e.gamma || 0), 'absolute');
        return;
      }
      // Relative stream: only trust it if no absolute source ever showed up,
      // and tell the user the compass is shaky.
      if (!gotAbsolute && e.alpha != null) {
        acceptHeading(headingFromEuler(e.alpha, e.beta || 0, e.gamma || 0), 'relative');
      }
    }

    function showCompassWarn() {
      const status = $('spot-status');
      if (status.textContent !== S.compass_warn) {
        status.textContent = S.compass_warn;
        status.className = 'spot-status warn';
      }
    }

    // ── Debug overlay (?debug=1) ──
    function updateDebug() {
      const el = $('spot-debug');
      if (!el) return;
      el.classList.add('visible');
      const f = (v, n = 1) => (v == null ? '--' : Number(v).toFixed(n));
      const lines = [
        'src: ' + (headingSource || '--') + (headingSource === 'relative' ? '  (!) no absolute compass' : ''),
        'heading: raw ' + f(rawHeading) + '°  smoothed ' + f(smoothedHeading) + '°  decl ' + DECLINATION + '°',
        tiltMag != null ? 'tilt: ' + f(tiltMag, 2) + (tiltMag >= 0.35 ? '  (camera mode)' : '  (near-flat: top-edge blend)') : null,
        iosAccuracy != null ? 'ios accuracy: ±' + f(iosAccuracy) + '°' + (iosAccuracy < 0 ? ' (uncalibrated)' : '') : null,
        'gps: ' + f(userLat, 5) + ', ' + f(userLng, 5) + '  ±' + f(gpsAccuracy, 0) + 'm',
        'vessels: ' + vessels.length + '  cone ±' + CONE_HALF + '°',
      ].filter(Boolean);
      debugState.candidates.slice(0, 3).forEach((c, i) => {
        lines.push((c.matched ? '★' : ' ') + (i + 1) + '. ' + c.name + '  ' + f(c.dist) + 'km  brg ' + f(c.bearing, 0) + '°  Δ' + f(c.diff, 0) + '°  score ' + f(c.score));
      });
      el.textContent = lines.join('\n');
    }

    // ── Start / Stop ──
    async function startSpotting() {
      const btn = $('spot-start');
      const status = $('spot-status');

      if (active) { stopSpotting(); return; }

      // Hide calibration tip
      $('calibration-tip').classList.remove('visible');

      btn.disabled = true;
      status.textContent = S.getting_perms;
      status.className = 'spot-status';

      // iOS compass permission (must be from direct user gesture)
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response !== 'granted') {
            status.textContent = S.no_compass_perm;
            status.className = 'spot-status error';
            btn.disabled = false;
            return;
          }
        } catch (e) {
          status.textContent = S.no_compass_perm;
          status.className = 'spot-status error';
          btn.disabled = false;
          return;
        }
      } else if (!('DeviceOrientationEvent' in window)) {
        status.textContent = S.no_compass;
        status.className = 'spot-status error';
        btn.disabled = false;
        return;
      }

      status.textContent = S.getting_loc;

      // Use watchPosition for continuous GPS updates
      geoWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          gpsAccuracy = pos.coords.accuracy ?? null;

          // On first fix, start everything
          if (!active) {
            // Compass priority: quaternion AbsoluteOrientationSensor (Chrome
            // Android, no Euler ambiguity) > absolute stream > generic stream
            // (iOS webkitCompassHeading / Firefox absolute / relative fallback).
            // Event listeners stay attached as fallback; they defer to the
            // sensor once it produces readings.
            startSensor();
            window.addEventListener('deviceorientationabsolute', onOrientationAbsolute, true);
            window.addEventListener('deviceorientation', onOrientationGeneric, true);

            // If we're still on the relative fallback after 3s, warn the user
            // that the compass is unreliable on this device.
            warnTimer = setTimeout(() => {
              if (active && !gotAbsolute) showCompassWarn();
            }, 3000);

            active = true;
            btn.disabled = false;
            $('t-start').textContent = S.stop;
            btn.classList.add('stop-btn');
            status.textContent = S.point;
            $('spot-scanner').classList.add('active');
            $('spot-heading-display').classList.add('visible');
            $('spot-reset').classList.add('visible');

            // Heading-up mode: camera locked to the user, pan/rotate gestures
            // off (pinch zoom still works), user anchored toward the bottom of
            // the view so the area ahead gets the screen space.
            map.dragPan.disable();
            map.touchZoomRotate.disableRotation();
            map.setPadding({ top: Math.round(map.getContainer().clientHeight * 0.35), left: 0, right: 0, bottom: 0 });
            $('spot-north').classList.add('visible');
            $('spot-zoom').classList.add('visible');
            map.jumpTo({ center: [userLng, userLat], zoom: zoomForDistanceKm(DEFAULT_VIEW_KM) });

            loadVessels();
            matchInterval = setInterval(() => {
              loadVessels();
              const match = findMatchingVessel();
              // Drive auto-zoom: reach the matched boat; otherwise the wide scan view
              autoViewKm = match ? match.dist : DEFAULT_VIEW_KM;
              if (match) showResult(match);
              else showNoMatch();
            }, 1500);
          }

          updateMap();
        },
        () => {
          status.textContent = S.no_gps;
          status.className = 'spot-status error';
          btn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 2000 }
      );
    }

    function stopSpotting() {
      active = false;
      if (orientationSensor) {
        try { orientationSensor.stop(); } catch (e) { /* already stopped */ }
        orientationSensor = null;
      }
      sensorActive = false;
      window.removeEventListener('deviceorientationabsolute', onOrientationAbsolute, true);
      window.removeEventListener('deviceorientation', onOrientationGeneric, true);
      if (warnTimer) { clearTimeout(warnTimer); warnTimer = null; }
      if (matchInterval) clearInterval(matchInterval);
      if (geoWatchId != null) {
        navigator.geolocation.clearWatch(geoWatchId);
        geoWatchId = null;
      }
      $('t-start').textContent = S.start;
      $('spot-start').classList.remove('stop-btn');
      $('spot-scanner').classList.remove('active');
      $('spot-heading-display').classList.remove('visible');
      $('spot-reset').classList.remove('visible');
      $('spot-status').textContent = '';
      $('spot-result').classList.remove('visible');
      $('no-match').classList.remove('visible');
      highlightMatch(null);
      lastMatchMmsi = null;

      // Leave heading-up mode: restore gestures, settle back to north-up
      map.dragPan.enable();
      map.touchZoomRotate.enableRotation();
      map.setPadding({ top: 0, left: 0, right: 0, bottom: 0 });
      $('spot-north').classList.remove('visible');
      $('spot-zoom').classList.remove('visible');
      autoViewKm = null;
      map.easeTo({ bearing: 0, duration: 400 });

      // Clear cone
      if (map.isStyleLoaded()) {
        map.getSource('cone')?.setData({ type: 'FeatureCollection', features: [] });
      }
    }

    // ── Reset / Recalibrate ──
    function resetSpotting() {
      // Stop everything, clear state, restart
      smoothedHeading = null;
      compassHeading = null;
      rawHeading = null;
      headingSource = null;
      gotAbsolute = false;
      iosAccuracy = null;
      tiltMag = null;
      userLat = null;
      userLng = null;
      gpsAccuracy = null;
      stopSpotting();
      // Small delay then restart
      setTimeout(() => startSpotting(), 300);
    }

    // ── Event listeners ──
    $('spot-start').addEventListener('click', startSpotting);
    $('spot-reset').addEventListener('click', resetSpotting);

    // Manual zoom: +/- buttons and pinch both pause auto-zoom for a while so
    // the user stays in control, then auto-fit resumes.
    const MANUAL_ZOOM_HOLD_MS = 12000;
    $('spot-zoom-in').addEventListener('click', () => {
      manualZoomUntil = Date.now() + MANUAL_ZOOM_HOLD_MS;
      map.zoomTo(Math.min(map.getZoom() + 1, 17), { duration: 200 });
    });
    $('spot-zoom-out').addEventListener('click', () => {
      manualZoomUntil = Date.now() + MANUAL_ZOOM_HOLD_MS;
      map.zoomTo(Math.max(map.getZoom() - 1, 8), { duration: 200 });
    });
    map.on('zoomstart', (e) => {
      // Only user gestures (pinch/double-tap) carry originalEvent
      if (e.originalEvent) manualZoomUntil = Date.now() + MANUAL_ZOOM_HOLD_MS;
    });

    // Load vessels for map display even before starting
    loadVessels();
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body>
